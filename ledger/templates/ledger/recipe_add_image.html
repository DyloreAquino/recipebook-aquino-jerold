{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h3>Please select an image:</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <button type="submit">
            Submit
        </button>
    </form>
    
    <p>
        <a href="{% url 'ledger:recipe_detail' pk=recipe.pk %}">
            Back to {{ recipe.name }}!
        </a>
    </p>
{% endblock %}
