{% extends 'recipebook.html' %}

{% block content %}
    <h2>
        {{ object.name }}
    </h2>

    <ul>
        {% for ingredient in object.ingredients.all %}
            <li>
                {{ ingredient.ingredient.name }}
            </li>
        {% endfor %}
    </ul>

    <p>
        <a href="/recipes/list">
            Back to Recipes List!
        </a>
    </p>
{% endblock %}
