{% extends 'recipebook.html' %}

{% block content %}
    <h2>
        {{ recipes.1.name }}
    </h2>

    <ul>
        {% for ingredient in recipes.1.ingredients %}
            <li>
                {{ ingredient.name }}, {{ ingredient.quantity }}
            </li>
        {% endfor %}
    </ul>

    <p>
        <a href="/recipes/list">
            Back to Recipes List!
        </a>
    </p>
{% endblock %}
